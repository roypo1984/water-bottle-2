<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學科學實驗：熱水散熱與保溫模擬器</title>
  <style>
    :root {
      --primary: #4A90E2;
      --primary-dark: #2A68B2;
      --accent-warm: #FF6B6B;
      --accent-cool: #4ECDC4;
      --bg: #F4F8FB;
      --panel-bg: #FFFFFF;
      --text: #2C3E50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 26px;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }

    header p {
      font-size: 15px;
      color: #666;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 控制面板 */
    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select, input[type="range"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    select:focus, input[type="range"]:focus {
      border-color: var(--primary);
    }

    .val-display {
      display: inline-block;
      float: right;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-start {
      background-color: #2ECC71;
      color: white;
    }
    .btn-start:hover { background-color: #27AE60; }

    .btn-pause {
      background-color: #F1C40F;
      color: white;
    }
    .btn-pause:hover { background-color: #D4AC0D; }

    .btn-reset {
      background-color: #E74C3C;
      color: white;
    }
    .btn-reset:hover { background-color: #C0392B; }

    .btn-record {
      background-color: var(--primary);
      color: white;
    }
    .btn-record:hover { background-color: var(--primary-dark); }

    /* 模擬主畫面 */
    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .visual-arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(to bottom, #FFFFFF, #EDF4FB);
      border-radius: 16px;
      padding: 25px;
      min-height: 250px;
    }

    /* 水杯與水蒸氣動畫 */
    .cup-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .steam-box {
      height: 45px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: flex-end;
    }

    .steam-puff {
      width: 8px;
      height: 25px;
      background: rgba(180, 200, 220, 0.6);
      border-radius: 50%;
      filter: blur(4px);
      animation: steamAnim 1.8s infinite ease-out;
    }

    .steam-puff:nth-child(2) { animation-delay: 0.6s; height: 35px; }
    .steam-puff:nth-child(3) { animation-delay: 1.2s; }

    @keyframes steamAnim {
      0% { transform: translateY(0) scaleX(1); opacity: 0.7; }
      100% { transform: translateY(-30px) scaleX(2.2); opacity: 0; }
    }

    .cup {
      width: 120px;
      height: 140px;
      border: 6px solid #CBD5E1;
      border-top: none;
      border-radius: 0 0 24px 24px;
      position: relative;
      background: rgba(255, 255, 255, 0.4);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .cup-lid {
      position: absolute;
      top: 40px;
      width: 136px;
      height: 12px;
      background: #94A3B8;
      border-radius: 6px;
      z-index: 5;
      display: none;
    }

    .water-fill {
      width: 100%;
      height: 80%;
      background: linear-gradient(to top, #FF7675, #FFAA91);
      transition: background 0.5s;
    }

    .cup-label {
      margin-top: 10px;
      font-weight: bold;
      color: #555;
    }

    /* 溫度計視覺 */
    .thermometer-wrap {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .thermo-tube {
      width: 22px;
      height: 180px;
      background: #E2E8F0;
      border-radius: 12px 12px 0 0;
      position: relative;
      border: 3px solid #CBD5E1;
      display: flex;
      align-items: flex-end;
      padding: 2px;
    }

    .thermo-bulb {
      width: 42px;
      height: 42px;
      background: #FF6B6B;
      border-radius: 50%;
      position: absolute;
      bottom: -22px;
      left: -13px;
      border: 3px solid #CBD5E1;
      z-index: 2;
      transition: background 0.3s;
    }

    .thermo-mercury {
      width: 100%;
      height: 70%;
      background: #FF6B6B;
      border-radius: 8px 8px 0 0;
      transition: height 0.3s, background 0.3s;
    }

    .temp-number-box {
      text-align: center;
    }

    .temp-big-val {
      font-size: 38px;
      font-weight: 900;
      color: var(--accent-warm);
      line-height: 1;
    }

    .time-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: #E2E8F0;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* 圖表與數據表 */
    .chart-container {
      position: relative;
      width: 100%;
      height: 240px;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: #FAFAFA;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
    }

    .table-container {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: center;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #E2E8F0;
    }

    th {
      background-color: #F8FAFC;
      position: sticky;
      top: 0;
      color: #64748B;
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔬 小學科學：熱水散熱與保溫模擬實驗</h1>
    <p>觀察不同容器、水溫與環境溫度下，熱水的冷卻速度變化</p>
  </header>

  <div class="container">
    <!-- 左側參數控制區 -->
    <div class="card">
      <div class="section-title">⚙️ 實驗條件設定</div>
      
      <div class="control-group">
        <label>容器材質
          <span class="val-display" id="disp-mat-rate">普通散熱</span>
        </label>
        <select id="sel-material">
          <option value="0.0006" data-color="#94A3B8" data-lid="true">雙層不鏽鋼保溫瓶 (極佳)</option>
          <option value="0.0020" data-color="#FDE047" data-lid="false">包裹毛巾的玻璃杯 (良)</option>
          <option value="0.0045" data-color="#F97316" data-lid="false">發泡膠杯 / 陶瓷杯 (普通)</option>
          <option value="0.0075" data-color="#38BDF8" data-lid="false">塑膠隨手杯 (一般)</option>
          <option value="0.0130" data-color="#CBD5E1" data-lid="false" selected>敞口無蓋玻璃杯 (快)</option>
        </select>
      </div>

      <div class="control-group">
        <label>杯蓋狀態</label>
        <select id="sel-lid">
          <option value="none">無蓋 (熱氣容易散失)</option>
          <option value="covered">蓋上杯蓋 (阻擋對流與蒸發)</option>
        </select>
      </div>

      <div class="control-group">
        <label>初始水溫 (°C) <span class="val-display" id="disp-init-temp">90°C</span></label>
        <input type="range" id="rng-init-temp" min="50" max="98" value="90">
      </div>

      <div class="control-group">
        <label>室溫 / 環境溫度 (°C) <span class="val-display" id="disp-env-temp">24°C</span></label>
        <input type="range" id="rng-env-temp" min="10" max="35" value="24">
      </div>

      <div class="control-group">
        <label>時間流速</label>
        <select id="sel-speed">
          <option value="1">1x (正常速度)</option>
          <option value="5" selected>5x (加速模擬)</option>
          <option value="20">20x (超快速實驗)</option>
        </select>
      </div>

      <div class="btn-grid">
        <button class="btn-start" id="btn-start">▶ 開始實驗</button>
        <button class="btn-pause" id="btn-pause" disabled>⏸ 暫停</button>
        <button class="btn-record" id="btn-record">📝 記錄數據</button>
        <button class="btn-reset" id="btn-reset">🔄 重置</button>
      </div>
    </div>

    <!-- 右側實驗演示與數據圖表 -->
    <div class="main-panel">
      
      <!-- 視覺演示區 -->
      <div class="card visual-arena">
        <div class="cup-container">
          <div class="steam-box" id="steam-box">
            <div class="steam-puff"></div>
            <div class="steam-puff"></div>
            <div class="steam-puff"></div>
          </div>
          <div class="cup-lid" id="cup-lid"></div>
          <div class="cup" id="cup-border">
            <div class="water-fill" id="water-fill"></div>
          </div>
          <div class="cup-label" id="cup-label">敞口無蓋玻璃杯</div>
        </div>

        <div class="thermometer-wrap">
          <div class="thermo-tube">
            <div class="thermo-mercury" id="thermo-mercury"></div>
            <div class="thermo-bulb" id="thermo-bulb"></div>
          </div>
          <div class="temp-number-box">
            <div class="temp-big-val" id="text-temp">90.0°C</div>
            <div class="time-badge">⏱️ 經過時間: <span id="text-time">00:00</span></div>
          </div>
        </div>
      </div>

      <!-- 圖表與紀錄表 -->
      <div class="card">
        <div class="section-title">📈 溫度變化曲線 (冷卻折線圖)</div>
        <div class="chart-container">
          <canvas id="chartCanvas"></canvas>
        </div>

        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
          <div class="section-title" style="margin: 0; font-size: 16px;">📋 實驗數據紀錄表</div>
          <button id="btn-export" style="background: #64748B; color: #FFF; padding: 5px 12px; font-size: 12px;">匯出 CSV</button>
        </div>

        <div class="table-container">
          <table id="data-table">
            <thead>
              <tr>
                <th>紀錄序號</th>
                <th>經過時間 (分:秒)</th>
                <th>當前水溫 (°C)</th>
                <th>累計降溫幅度 (°C)</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- 動態紀錄插入 -->
            </tbody>
          </table>
        </div>

      </div>

    </div>
  </div>

  <script>
    // 實驗變數狀態
    let isRunning = false;
    let timerId = null;
    let elapsedTimeSec = 0;
    let currentTemp = 90.0;
    let initTemp = 90.0;
    let envTemp = 24.0;
    let coolingK = 0.0130;
    let simSpeed = 5;
    let dataHistory = [];
    let recordCount = 0;

    // DOM 元素快取
    const textTemp = document.getElementById('text-temp');
    const textTime = document.getElementById('text-time');
    const thermoMercury = document.getElementById('thermo-mercury');
    const thermoBulb = document.getElementById('thermo-bulb');
    const waterFill = document.getElementById('water-fill');
    const steamBox = document.getElementById('steam-box');
    const cupLid = document.getElementById('cup-lid');
    const cupBorder = document.getElementById('cup-border');
    const cupLabel = document.getElementById('cup-label');
    const tableBody = document.getElementById('table-body');
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    // 初始化與事件綁定
    function init() {
      resizeCanvas();
      window.addEventListener('resize', () => { resizeCanvas(); drawChart(); });

      // 滑桿與選單連動
      document.getElementById('rng-init-temp').addEventListener('input', (e) => {
        initTemp = parseFloat(e.target.value);
        document.getElementById('disp-init-temp').textContent = `${initTemp}°C`;
        if (!isRunning && elapsedTimeSec === 0) {
          currentTemp = initTemp;
          updateVisuals();
        }
      });

      document.getElementById('rng-env-temp').addEventListener('input', (e) => {
        envTemp = parseFloat(e.target.value);
        document.getElementById('disp-env-temp').textContent = `${envTemp}°C`;
      });

      document.getElementById('sel-speed').addEventListener('change', (e) => {
        simSpeed = parseInt(e.target.value, 10);
      });

      document.getElementById('sel-material').addEventListener('change', updateMaterialSettings);
      document.getElementById('sel-lid').addEventListener('change', updateMaterialSettings);

      // 控制按鈕
      document.getElementById('btn-start').addEventListener('click', startSimulation);
      document.getElementById('btn-pause').addEventListener('click', pauseSimulation);
      document.getElementById('btn-reset').addEventListener('click', resetSimulation);
      document.getElementById('btn-record').addEventListener('click', recordCurrentData);
      document.getElementById('btn-export').addEventListener('click', exportCSV);

      updateMaterialSettings();
      resetSimulation();
    }

    function updateMaterialSettings() {
      const matSelect = document.getElementById('sel-material');
      const lidSelect = document.getElementById('sel-lid');
      const selectedOption = matSelect.options[matSelect.selectedIndex];

      let baseK = parseFloat(matSelect.value);
      const hasLid = (lidSelect.value === 'covered');

      // 有杯蓋減緩約 40% 的散熱速率
      coolingK = hasLid ? baseK * 0.6 : baseK;

      cupLabel.textContent = selectedOption.text.split(' ')[0];
      cupBorder.style.borderColor = selectedOption.dataset.color || '#CBD5E1';
      cupLid.style.display = hasLid ? 'block' : 'none';

      document.getElementById('disp-mat-rate').textContent = (coolingK < 0.002) ? '極佳保溫' : (coolingK < 0.006 ? '中度保溫' : '快速散熱');
    }

    function startSimulation() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-pause').disabled = false;
      disableControls(true);

      timerId = setInterval(() => {
        // 牛頓冷卻定律計算：dT/dt = -k * (T - T_env)
        const dt = (1 / 10) * simSpeed; // 每次 tick 代表的時間增量 (秒)
        elapsedTimeSec += dt;

        const deltaTemp = -coolingK * (currentTemp - envTemp) * (dt / 1);
        currentTemp += deltaTemp;

        // 若接近環境溫度則停止
        if (currentTemp <= envTemp + 0.05) {
          currentTemp = envTemp;
          pauseSimulation();
        }

        // 定期將點加入圖表數據 (每模擬 5 秒記錄一次點)
        if (dataHistory.length === 0 || elapsedTimeSec - dataHistory[dataHistory.length - 1].time >= 5) {
          dataHistory.push({ time: elapsedTimeSec, temp: currentTemp });
        }

        updateVisuals();
        drawChart();
      }, 100);
    }

    function pauseSimulation() {
      isRunning = false;
      clearInterval(timerId);
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-pause').disabled = true;
    }

    function resetSimulation() {
      pauseSimulation();
      elapsedTimeSec = 0;
      currentTemp = initTemp;
      dataHistory = [{ time: 0, temp: initTemp }];
      recordCount = 0;
      tableBody.innerHTML = '';
      disableControls(false);
      updateVisuals();
      drawChart();
    }

    function disableControls(disabled) {
      document.getElementById('rng-init-temp').disabled = disabled;
      document.getElementById('sel-material').disabled = disabled;
      document.getElementById('sel-lid').disabled = disabled;
      document.getElementById('rng-env-temp').disabled = disabled;
    }

    function updateVisuals() {
      // 顯示數值
      textTemp.textContent = `${currentTemp.toFixed(1)}°C`;
      
      const mins = Math.floor(elapsedTimeSec / 60);
      const secs = Math.floor(elapsedTimeSec % 60);
      textTime.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      // 計算溫度比率 (0°C ~ 100°C)
      const ratio = Math.max(0, Math.min(1, currentTemp / 100));
      thermoMercury.style.height = `${ratio * 100}%`;

      // 顏色隨溫度由紅轉藍
      const hue = ratio * 0; // 0=紅色，低溫可至 200 (藍)
      const colorVal = `hsl(${Math.round(ratio * 30)}, 85%, 55%)`;
      thermoMercury.style.background = colorVal;
      thermoBulb.style.background = colorVal;
      textTemp.style.color = colorVal;

      waterFill.style.background = `linear-gradient(to top, ${colorVal}, rgba(255, 255, 255, 0.4))`;

      // 水蒸氣動畫強度控制
      if (currentTemp > 60 && document.getElementById('sel-lid').value !== 'covered') {
        steamBox.style.opacity = (currentTemp - 60) / 40;
      } else {
        steamBox.style.opacity = '0';
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function drawChart() {
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      const padding = { top: 20, right: 30, bottom: 30, left: 45 };

      ctx.clearRect(0, 0, w, h);

      const maxTime = Math.max(300, elapsedTimeSec * 1.15); // 最少顯示 5 分鐘 (300 秒)
      const maxTemp = 100;
      const minTemp = Math.min(0, envTemp - 5);

      // 繪製格線與刻度
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#94A3B8';
      ctx.font = '11px sans-serif';

      // Y 軸 (溫度)
      for (let t = 0; t <= 100; t += 20) {
        const y = h - padding.bottom - ((t - minTemp) / (maxTemp - minTemp)) * (h - padding.top - padding.bottom);
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(w - padding.right, y);
        ctx.stroke();
        ctx.fillText(`${t}°C`, 10, y + 4);
      }

      // X 軸 (時間 分鐘)
      for (let sec = 0; sec <= maxTime; sec += 120) {
        const x = padding.left + (sec / maxTime) * (w - padding.left - padding.right);
        ctx.beginPath();
        ctx.moveTo(x, padding.top);
        ctx.lineTo(x, h - padding.bottom);
        ctx.stroke();
        ctx.fillText(`${Math.round(sec / 60)}分`, x - 8, h - 10);
      }

      // 環境溫度基準線
      const envY = h - padding.bottom - ((envTemp - minTemp) / (maxTemp - minTemp)) * (h - padding.top - padding.bottom);
      ctx.strokeStyle = 'rgba(78, 205, 196, 0.6)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(padding.left, envY);
      ctx.lineTo(w - padding.right, envY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#4ECDC4';
      ctx.fillText(`室溫 (${envTemp}°C)`, w - padding.right - 70, envY - 5);

      if (dataHistory.length < 2) return;

      // 繪製溫度冷卻曲線
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 3;
      ctx.beginPath();

      dataHistory.forEach((pt, index) => {
        const x = padding.left + (pt.time / maxTime) * (w - padding.left - padding.right);
        const y = h - padding.bottom - ((pt.temp - minTemp) / (maxTemp - minTemp)) * (h - padding.top - padding.bottom);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function recordCurrentData() {
      recordCount++;
      const mins = Math.floor(elapsedTimeSec / 60);
      const secs = Math.floor(elapsedTimeSec % 60);
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const diffTemp = (initTemp - currentTemp).toFixed(1);

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>#${recordCount}</td>
        <td>${timeStr}</td>
        <td style="font-weight:bold; color:#FF6B6B;">${currentTemp.toFixed(1)} °C</td>
        <td>-${diffTemp} °C</td>
      `;
      tableBody.appendChild(row);
      row.scrollIntoView({ behavior: 'smooth' });
    }

    function exportCSV() {
      const rows = document.querySelectorAll('#data-table tr');
      let csvContent = 'data:text/csv;charset=utf-8,\uFEFF';

      rows.forEach(row => {
        const cols = row.querySelectorAll('th, td');
        const rowData = Array.from(cols).map(c => `"${c.innerText}"`).join(',');
        csvContent += rowData + '\r\n';
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `水溫散熱實驗數據_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = init;
  </script>
</body>
